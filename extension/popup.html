<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 12px; font: 14px/1.4 system-ui, sans-serif; color: #1d2a36; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      label { display: block; margin: 10px 0 4px; font-weight: 600; }
      select { width: 100%; font: inherit; padding: 3px; }
      p { margin: 10px 0 0; font-size: 12px; color: #4a5a6a; }
    </style>
  </head>
  <body>
    <h1>Shelf Check</h1>
    <label for="library">Library network</label>
    <select id="library"></select>
    <label for="home">My library</label>
    <select id="home"></select>
    <label for="second">Second library (optional)</label>
    <select id="second"></select>
    <p id="saved" aria-live="polite"></p>
    <p>Open catalogue pages update straight away.</p>
    <p><a href="#" id="taste">Taste profile and Goodreads / StoryGraph import</a></p>
    <p>Unofficial tool. Not affiliated with Brisbane City Council.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
